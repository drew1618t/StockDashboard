<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WPR · Then and Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0B; --text: #E8E8EC; --text-2: #A0A0A8; --muted: #636369;
    --line: #1E1E22; --accent: #6B8BA4; --pos: #4ADE80; --neg: #F87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: baseline; gap: 20px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  header .brand { font-weight: 600; letter-spacing: .12em; font-size: 12px; }
  header nav a { color: var(--text-2); margin-right: 16px; font-size: 12px; }
  main { max-width: 900px; margin: 0 auto; padding: 28px 24px 60px; }
  h1 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 20px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stats > div { display: flex; flex-wrap: wrap; gap: 0 22px; padding: 10px 0; }
  .stats > div + div { border-left: 1px solid var(--line); padding-left: 24px; }
  .stat { display: flex; gap: 6px; align-items: baseline; }
  .stat .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .stat .v { font-size: 14px; font-weight: 500; }
  .stats .prior .v { color: var(--text-2); font-weight: 400; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; margin-top: 14px; }
  .col + .col { border-left: 1px solid var(--line); padding-left: 24px; }
  .col .h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .r { display: grid; grid-template-columns: 24px 64px 1fr 48px; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .now .r { grid-template-columns: 24px 64px 1fr 44px 48px 52px; }
  .r .rk { color: var(--muted); font-size: 11px; }
  .r .tk { font-weight: 500; letter-spacing: .04em; font-size: 14px; }
  .r .nm { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r .w { text-align: right; font-size: 14px; }
  .prior .r { color: var(--text-2); }
  .prior .r .tk { font-weight: 400; }
  .r .c { text-align: right; font-size: 12px; }
  .r .mv { font-size: 11px; color: var(--accent); text-align: right; }
  .pos-t { color: var(--pos); } .neg-t { color: var(--neg); } .mut { color: var(--muted); }
  .r.gone { color: var(--muted); }
  .r.gone .w { text-decoration: line-through; }
  .r.gone .nm::after { content: ' · sold'; color: var(--neg); }
  .r.gone-m { display: none; }
  .r.new .nm::after { content: ' · new'; color: var(--pos); }
  .video { display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 22px; align-items: baseline; }
  .video .d { color: var(--muted); font-size: 12px; }
  .video .links a { margin-left: 14px; font-size: 12px; }
  .foot { color: var(--muted); font-size: 11px; margin-top: 14px; }
  @media (max-width: 640px) {
    main { padding: 20px 14px 40px; }
    .stats { grid-template-columns: 1fr; }
    .stats > div + div { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); }
    .cols { grid-template-columns: 1fr; }
    .col.prior { display: none; }
    .r.gone-m { display: grid; }
    .col + .col { border-left: 0; padding-left: 0; }
    .now .r { grid-template-columns: 22px 56px 1fr 40px 44px 48px; gap: 6px; }
    .r .tk, .r .w { font-size: 13px; }
    .video { grid-template-columns: 1fr; gap: 4px; }
    .video .links a { margin: 0 14px 0 0; }
  }
</style>
</head>
<body>
<header><span class="brand">WPR</span><nav><a href="#">Home</a><a href="#">Dashboard</a><a href="#">Videos</a></nav></header>
<main>
  <h1>Then and now</h1>
  <p class="sub" id="sub"></p>
  <div class="stats" id="stats"></div>
  <div class="cols" id="cols"></div>
  <div class="video" id="video"></div>
  <p class="foot">Weights from WPR's weekly allocation slides. Rank moves and weight changes include price moves. Sold and new labels come from the video.</p>
</main>
<script>
const D = {"date":"2026-09-13","prev_date":"2026-09-06","metrics":{"ytd_return_pct":28.0,"foreign_listed_tech_pct":2.2,"top_4_pct":64.1,"top_10_pct":89.9},"prev_metrics":{"ytd_return_pct":27.0,"foreign_listed_tech_pct":2.2,"top_4_pct":64.5,"top_10_pct":90.5},"holdings":[{"ticker":"SIMO","company_name":"Silicon Motion","weight_pct":17.7,"previous_weight_pct":16.1,"change_pct":1.6,"decision":null},{"ticker":"ALAB","company_name":"Astera Labs","weight_pct":16.3,"previous_weight_pct":17.6,"change_pct":-1.3,"decision":null},{"ticker":"FIGR","company_name":"Figure Technology","weight_pct":15.7,"previous_weight_pct":16.3,"change_pct":-0.6,"decision":null},{"ticker":"LIFE","company_name":"Ethos Technologies","weight_pct":14.4,"previous_weight_pct":14.5,"change_pct":-0.1,"decision":null},{"ticker":"LITE","company_name":"Lumentum","weight_pct":6.3,"previous_weight_pct":6.0,"change_pct":0.3,"decision":null},{"ticker":"ONTO","company_name":"Onto Innovation","weight_pct":6.0,"previous_weight_pct":5.8,"change_pct":0.2,"decision":null},{"ticker":"MU","company_name":"Micron","weight_pct":5.5,"previous_weight_pct":5.8,"change_pct":-0.3,"decision":null},{"ticker":"COHU","company_name":"Cohu","weight_pct":3.1,"previous_weight_pct":2.8,"change_pct":0.3,"decision":null},{"ticker":"KLIC","company_name":"Kulicke & Soffa","weight_pct":2.7,"previous_weight_pct":2.6,"change_pct":0.1,"decision":null},{"ticker":"SMTC","company_name":"Semtech","weight_pct":2.2,"previous_weight_pct":2.0,"change_pct":0.2,"decision":null},{"ticker":"RDVT","company_name":"Red Violet","weight_pct":1.9,"previous_weight_pct":2.0,"change_pct":-0.1,"decision":null},{"ticker":"SNDK","company_name":"Sandisk","weight_pct":1.8,"previous_weight_pct":3.0,"change_pct":-1.2,"decision":"trimmed_still_held"},{"ticker":"MTSI","company_name":"MACOM Technology Solutions","weight_pct":1.7,"previous_weight_pct":null,"change_pct":null,"decision":"new_starter_position"},{"ticker":"VIAV","company_name":"VIAVI Solutions","weight_pct":1.5,"previous_weight_pct":null,"change_pct":null,"decision":"new_starter_position"},{"ticker":"RELL","company_name":"Richardson Electronics","weight_pct":0.9,"previous_weight_pct":0.9,"change_pct":0.0,"decision":null}],"departed":[{"ticker":"CRDO","company_name":"Credo","previous_weight_pct":1.7,"decision":"sold_remaining_position"},{"ticker":"SITM","company_name":"SiTime","previous_weight_pct":0.5,"decision":"sold"}],"prev_holdings":[{"ticker":"ALAB","weight_pct":17.6},{"ticker":"FIGR","weight_pct":16.3},{"ticker":"SIMO","weight_pct":16.1},{"ticker":"LIFE","weight_pct":14.5},{"ticker":"LITE","weight_pct":6.0},{"ticker":"ONTO","weight_pct":5.8},{"ticker":"MU","weight_pct":5.8},{"ticker":"SNDK","weight_pct":3.0},{"ticker":"COHU","weight_pct":2.8},{"ticker":"KLIC","weight_pct":2.6},{"ticker":"SMTC","weight_pct":2.0},{"ticker":"RDVT","weight_pct":2.0},{"ticker":"CRDO","weight_pct":1.7},{"ticker":"RELL","weight_pct":0.9},{"ticker":"SITM","weight_pct":0.5}],"videos":[{"video_id":"gj2AlI4J-6Q","date":"2026-09-13","title":"Two new portfolio companies & new growth stock ideas","url":"https://www.youtube.com/watch?v=gj2AlI4J-6Q"}]};

const fmtDate = s => new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const sign = n => (n > 0 ? '+' : '') + n.toFixed(1);
document.getElementById('sub').textContent = `Slide of ${fmtDate(D.date)} beside the slide of ${fmtDate(D.prev_date)}`;

const stat = (l, v) => `<div class="stat"><span class="l">${l}</span><span class="v">${v}%</span></div>`;
const strip = (m, cls, label) => `<div class="${cls}"><div class="stat"><span class="l">${label}</span></div>${stat('YTD', '+' + m.ytd_return_pct)}${stat('Top 4', m.top_4_pct)}${stat('Top 10', m.top_10_pct)}${stat('Foreign', m.foreign_listed_tech_pct)}</div>`;
document.getElementById('stats').innerHTML = strip(D.prev_metrics, 'prior', fmtDate(D.prev_date)) + strip(D.metrics, 'now', fmtDate(D.date));

/* Rank lookup for the prior slide so each current row can show how far it moved. */
const prevRank = {}; D.prev_holdings.forEach((h, i) => prevRank[h.ticker] = i + 1);
const names = {}; D.holdings.concat(D.departed).forEach(h => names[h.ticker] = h.company_name);
const sold = new Set(D.departed.map(d => d.ticker));

const priorRows = D.prev_holdings.map((h, i) => `<div class="r ${sold.has(h.ticker) ? 'gone' : ''}"><span class="rk">${i + 1}</span><span class="tk">${h.ticker}</span><span class="nm">${names[h.ticker]}</span><span class="w">${h.weight_pct.toFixed(1)}</span></div>`).join('');
const nowRows = D.holdings.map((h, i) => {
  const isNew = h.previous_weight_pct == null;
  const delta = isNew ? 0 : prevRank[h.ticker] - (i + 1);
  const mv = isNew ? '' : delta > 0 ? `&#9650; ${delta}` : delta < 0 ? `&#9660; ${-delta}` : '<span class="mut">&#8211;</span>';
  const c = isNew ? '' : h.change_pct === 0 ? '<span class="mut">0.0</span>' : `<span class="${h.change_pct > 0 ? 'pos' : 'neg'}-t">${sign(h.change_pct)}</span>`;
  return `<div class="r ${isNew ? 'new' : ''}"><span class="rk">${i + 1}</span><span class="tk">${h.ticker}</span><span class="nm">${h.company_name}</span><span class="w">${h.weight_pct.toFixed(1)}</span><span class="c">${c}</span><span class="mv">${mv}</span></div>`;
}).join('') +
  /* Departed tickers only appear here on narrow screens, where the prior column is hidden. */
  D.departed.map(d => `<div class="r gone gone-m"><span class="rk"></span><span class="tk">${d.ticker}</span><span class="nm">${d.company_name}</span><span class="w">${d.previous_weight_pct.toFixed(1)}</span><span class="c mut">out</span><span class="mv"></span></div>`).join('');
document.getElementById('cols').innerHTML =
  `<div class="col prior"><div class="h"><span>${fmtDate(D.prev_date)}</span><span>${D.prev_holdings.length} positions</span></div>${priorRows}</div>` +
  `<div class="col now"><div class="h"><span>${fmtDate(D.date)}</span><span>${D.holdings.length} positions · weight · change · rank</span></div>${nowRows}</div>`;

const v = D.videos[0];
document.getElementById('video').innerHTML = `<span class="d">${fmtDate(v.date)}</span><span>${v.title}</span><span class="links"><a href="#">Report</a><a href="#">Transcript</a><a href="${v.url}">YouTube</a><a href="#">All videos</a></span>`;
</script>
</body>
</html>
