<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WPR · Movers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0B; --text: #E8E8EC; --text-2: #A0A0A8; --muted: #636369;
    --line: #1E1E22; --accent: #6B8BA4; --pos: #4ADE80; --neg: #F87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: baseline; gap: 20px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  header .brand { font-weight: 600; letter-spacing: .12em; font-size: 12px; }
  header nav a { color: var(--text-2); margin-right: 16px; font-size: 12px; }
  main { max-width: 1000px; margin: 0 auto; padding: 28px 24px 60px; }
  h1 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 20px; }
  .movers { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .block { padding: 14px 18px 16px; border-left: 1px solid var(--line); min-height: 110px; }
  .block:first-child { border-left: 0; padding-left: 0; }
  .block .h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 10px; }
  .block .h.pos { color: var(--pos); } .block .h.neg { color: var(--neg); }
  .mv { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .mv .tk { font-weight: 500; letter-spacing: .04em; }
  .mv .big { font-size: 22px; font-weight: 600; line-height: 1.1; }
  .mv .path { font-size: 11px; color: var(--muted); }
  .block .none { color: var(--muted); }
  .block .note { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .stats { display: flex; flex-wrap: wrap; gap: 0 32px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .stat { display: flex; gap: 8px; align-items: baseline; }
  .stat .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .stat .v { font-size: 15px; font-weight: 500; }
  .stat .d { font-size: 11px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; padding: 10px 8px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: baseline; }
  th.r, td.r { text-align: right; }
  td.rank { color: var(--muted); width: 28px; padding-left: 0; }
  td.tk { font-weight: 500; letter-spacing: .04em; width: 64px; }
  td.nm { color: var(--text-2); }
  td.w { font-size: 14px; font-weight: 500; }
  .pos-t { color: var(--pos); } .neg-t { color: var(--neg); } .mut { color: var(--muted); }
  tr.ghost td { color: var(--muted); }
  tr.ghost td.w { text-decoration: line-through; font-weight: 400; font-size: 13px; }
  .video { display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); margin-top: 22px; align-items: baseline; }
  .video .d { color: var(--muted); font-size: 12px; }
  .video .links a { margin-left: 14px; font-size: 12px; }
  .foot { color: var(--muted); font-size: 11px; margin-top: 14px; }
  @media (max-width: 640px) {
    main { padding: 20px 14px 40px; }
    .movers { grid-template-columns: 1fr 1fr; }
    .block { min-height: 0; padding: 12px 12px 14px; }
    .block:nth-child(odd) { border-left: 0; padding-left: 0; }
    .block:nth-child(n+3) { border-top: 1px solid var(--line); }
    .mv .big { font-size: 18px; }
    .stats { gap: 6px 18px; }
    td.nm, th.nm { display: none; }
    td, th { padding-left: 4px; padding-right: 4px; }
    .video { grid-template-columns: 1fr; gap: 4px; }
    .video .links a { margin: 0 14px 0 0; }
  }
</style>
</head>
<body>
<header><span class="brand">WPR</span><nav><a href="#">Home</a><a href="#">Dashboard</a><a href="#">Videos</a></nav></header>
<main>
  <h1>This week</h1>
  <p class="sub" id="sub"></p>
  <div class="movers" id="movers"></div>
  <div class="stats" id="stats"></div>
  <table id="table"></table>
  <div class="video" id="video"></div>
  <p class="foot">Weights from WPR's weekly allocation slide. Changes include price moves. In, Out, and Trimmed come from what the video disclosed; Added To and other weight moves are observations only.</p>
</main>
<script>
const D = {"date":"2026-09-13","prev_date":"2026-09-06","metrics":{"ytd_return_pct":28.0,"foreign_listed_tech_pct":2.2,"top_4_pct":64.1,"top_10_pct":89.9},"prev_metrics":{"ytd_return_pct":27.0,"foreign_listed_tech_pct":2.2,"top_4_pct":64.5,"top_10_pct":90.5},"holdings":[{"ticker":"SIMO","company_name":"Silicon Motion","weight_pct":17.7,"previous_weight_pct":16.1,"change_pct":1.6,"decision":null},{"ticker":"ALAB","company_name":"Astera Labs","weight_pct":16.3,"previous_weight_pct":17.6,"change_pct":-1.3,"decision":null},{"ticker":"FIGR","company_name":"Figure Technology","weight_pct":15.7,"previous_weight_pct":16.3,"change_pct":-0.6,"decision":null},{"ticker":"LIFE","company_name":"Ethos Technologies","weight_pct":14.4,"previous_weight_pct":14.5,"change_pct":-0.1,"decision":null},{"ticker":"LITE","company_name":"Lumentum","weight_pct":6.3,"previous_weight_pct":6.0,"change_pct":0.3,"decision":null},{"ticker":"ONTO","company_name":"Onto Innovation","weight_pct":6.0,"previous_weight_pct":5.8,"change_pct":0.2,"decision":null},{"ticker":"MU","company_name":"Micron","weight_pct":5.5,"previous_weight_pct":5.8,"change_pct":-0.3,"decision":null},{"ticker":"COHU","company_name":"Cohu","weight_pct":3.1,"previous_weight_pct":2.8,"change_pct":0.3,"decision":null},{"ticker":"KLIC","company_name":"Kulicke & Soffa","weight_pct":2.7,"previous_weight_pct":2.6,"change_pct":0.1,"decision":null},{"ticker":"SMTC","company_name":"Semtech","weight_pct":2.2,"previous_weight_pct":2.0,"change_pct":0.2,"decision":null},{"ticker":"RDVT","company_name":"Red Violet","weight_pct":1.9,"previous_weight_pct":2.0,"change_pct":-0.1,"decision":null},{"ticker":"SNDK","company_name":"Sandisk","weight_pct":1.8,"previous_weight_pct":3.0,"change_pct":-1.2,"decision":"trimmed_still_held"},{"ticker":"MTSI","company_name":"MACOM Technology Solutions","weight_pct":1.7,"previous_weight_pct":null,"change_pct":null,"decision":"new_starter_position"},{"ticker":"VIAV","company_name":"VIAVI Solutions","weight_pct":1.5,"previous_weight_pct":null,"change_pct":null,"decision":"new_starter_position"},{"ticker":"RELL","company_name":"Richardson Electronics","weight_pct":0.9,"previous_weight_pct":0.9,"change_pct":0.0,"decision":null}],"departed":[{"ticker":"CRDO","company_name":"Credo","previous_weight_pct":1.7,"decision":"sold_remaining_position"},{"ticker":"SITM","company_name":"SiTime","previous_weight_pct":0.5,"decision":"sold"}],"videos":[{"video_id":"gj2AlI4J-6Q","date":"2026-09-13","title":"Two new portfolio companies & new growth stock ideas","url":"https://www.youtube.com/watch?v=gj2AlI4J-6Q"}]};

const LABEL = { new_starter_position: 'New', trimmed_still_held: 'Trimmed', sold: 'Sold', sold_remaining_position: 'Sold', added_still_held: 'Added' };
const fmtDate = s => new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const sign = n => (n > 0 ? '+' : '') + n.toFixed(1);
document.getElementById('sub').textContent = `Slide of ${fmtDate(D.date)}, compared with ${fmtDate(D.prev_date)}`;

/* Movers strip: disclosed decisions first; Added To falls back to the top weight gains. */
const ins = D.holdings.filter(h => h.decision === 'new_starter_position');
const outs = D.departed.filter(d => /sold/.test(d.decision || ''));
const trims = D.holdings.filter(h => /trim/.test(h.decision || ''));
const adds = D.holdings.filter(h => /added/.test(h.decision || ''));
const gains = D.holdings.filter(h => h.change_pct > 0).sort((a, b) => b.change_pct - a.change_pct).slice(0, 2);
const mv = (tk, big, path) => `<div class="mv"><span class="tk">${tk}</span><span><span class="big">${big}</span> <span class="path">${path}</span></span></div>`;
const block = (h, cls, items, note) => `<div class="block"><div class="h ${cls}">${h}</div>${items.length ? items.join('') : '<div class="none">none</div>'}${note ? `<div class="note">${note}</div>` : ''}</div>`;
document.getElementById('movers').innerHTML =
  block('In', 'pos', ins.map(h => mv(h.ticker, h.weight_pct.toFixed(1), 'starter'))) +
  block('Out', 'neg', outs.map(d => mv(d.ticker, '0', `from ${d.previous_weight_pct.toFixed(1)}`))) +
  block(adds.length ? 'Added to' : 'Weight up', 'pos', (adds.length ? adds : gains).map(h => mv(h.ticker, sign(h.change_pct), `${h.previous_weight_pct.toFixed(1)} to ${h.weight_pct.toFixed(1)}`)), adds.length ? '' : 'largest gains, no add disclosed') +
  block('Trimmed', 'neg', trims.map(h => mv(h.ticker, sign(h.change_pct), `${h.previous_weight_pct.toFixed(1)} to ${h.weight_pct.toFixed(1)}`)));

const m = D.metrics, p = D.prev_metrics;
const stat = (l, v, pv) => `<div class="stat"><span class="l">${l}</span><span class="v">${v}%</span><span class="d">from ${pv}%</span></div>`;
document.getElementById('stats').innerHTML = stat('YTD', '+' + m.ytd_return_pct, '+' + p.ytd_return_pct) + stat('Top 4', m.top_4_pct, p.top_4_pct) + stat('Top 10', m.top_10_pct, p.top_10_pct) + stat('Foreign tech', m.foreign_listed_tech_pct, p.foreign_listed_tech_pct);

const cTxt = h => h.change_pct == null ? '<span class="mut">new</span>' : h.change_pct === 0 ? '<span class="mut">0.0</span>' : `<span class="${h.change_pct > 0 ? 'pos' : 'neg'}-t">${sign(h.change_pct)}</span>`;
document.getElementById('table').innerHTML = `<tr><th></th><th>Ticker</th><th class="nm">Company</th><th class="r">Weight</th><th class="r">Prior</th><th class="r">Change</th><th>Decision</th></tr>` +
  D.holdings.map((h, i) => `<tr><td class="rank">${i + 1}</td><td class="tk">${h.ticker}</td><td class="nm">${h.company_name}</td><td class="r w">${h.weight_pct.toFixed(1)}</td><td class="r mut">${h.previous_weight_pct == null ? '' : h.previous_weight_pct.toFixed(1)}</td><td class="r">${cTxt(h)}</td><td class="mut">${LABEL[h.decision] || ''}</td></tr>`).join('') +
  D.departed.map(d => `<tr class="ghost"><td></td><td class="tk">${d.ticker}</td><td class="nm">${d.company_name}</td><td class="r w">${d.previous_weight_pct.toFixed(1)}</td><td class="r">${d.previous_weight_pct.toFixed(1)}</td><td class="r">out</td><td>${LABEL[d.decision] || 'Not on slide'}</td></tr>`).join('');

const v = D.videos[0];
document.getElementById('video').innerHTML = `<span class="d">${fmtDate(v.date)}</span><span>${v.title}</span><span class="links"><a href="#">Report</a><a href="#">Transcript</a><a href="${v.url}">YouTube</a><a href="#">All videos</a></span>`;
</script>
</body>
</html>
